# ---------------------------------------------------------------------------
# flightwatch config  --  SFO to Japan, May 2027
# ---------------------------------------------------------------------------
# Trip: out Fri 2027-05-14, back Sun 2027-05-23. Open jaw into HND, out of
# KIX (Tokyo -> Kyoto -> Osaka, no backtracking).
#
# PTO cost is in each route's `pto` field. Your cap is 6 weekdays. Routes
# over the cap are tracked as *levers*, not candidates: you need to know what
# the extra day costs before deciding whether to ask for it.
#
# `nonstop: true` on a route asks SerpApi's `stops` param for nonstop-only
# results (see providers.py) -- independent of, and not summed with, the
# stops-allowed variant of the same dates.
#
# Keep every `id` stable forever -- it is the join key for all history.
# ---------------------------------------------------------------------------

provider: serpapi          # amadeus | serpapi (amadeus keys disabled since 2026-07-17)
currency: USD
adults: 1                  # price ONE seat, multiply later. Group searches
                           # can surface worse fares when the cheap bucket
                           # has fewer than 4 seats left.
cabin: ECONOMY
max_stops: null            # null = allow connections (often $300 cheaper).
                           # Counted PER DIRECTION, not summed across the trip.
max_outbound_duration_min: 1200
                           # 20h hard cap on the OUTBOUND leg ONLY, passed to
                           # SerpApi as max_duration. SerpApi's multi-city
                           # first request can only see/filter the outbound
                           # leg -- the return leg is invisible until a
                           # full_read follow-up (see routes below and
                           # max_total_duration_min).
max_total_duration_min: 2280
                           # 38h cap on the TRUE combined (out+back) duration.
                           # Only enforced on routes with full_read: true --
                           # that's the only case where the real return-leg
                           # duration is known. Checked client-side in
                           # tracker.py after the follow-up request.

routes:
  # --- the trip -------------------------------------------------------
  - id: fri14_sun23_hnd_kix
    origin: SFO
    destination: HND
    depart: 2027-05-14
    return_origin: KIX
    return_destination: SFO
    return: 2027-05-23
    pto: 6
    full_read: true    # confirms the real return leg -- costs a 2nd SerpApi request
    target: true       # the one route the site's hero verdict/chart watches
    note: "TARGET -- Fri out / Sun back, open jaw. 6 PTO days, at cap."

  # --- the two seven-day variants -------------------------------------
  - id: thu13_sun23_hnd_kix
    origin: SFO
    destination: HND
    depart: 2027-05-13
    return_origin: KIX
    return_destination: SFO
    return: 2027-05-23
    pto: 7
    full_read: true    # confirms the real return leg -- costs a 2nd SerpApi request
    note: "Extra day at the FRONT. Five Tokyo nights, everything downstream
           moves deeper, no Sunday return premium. Preferred 7-day option."

  - id: fri14_mon24_hnd_kix
    origin: SFO
    destination: HND
    depart: 2027-05-14
    return_origin: KIX
    return_destination: SFO
    return: 2027-05-24
    pto: 7
    full_read: true    # confirms the real return leg -- costs a 2nd SerpApi request
    note: "Extra day at the BACK. Adds a day at the loose end and dodges the
           Sunday return premium. Weaker use of a 7th day than thu13."

  # --- same dates as the target, round-trip instead of open jaw --------
  - id: fri14_sun23_rt_hnd
    origin: SFO
    destination: HND
    depart: 2027-05-14
    return_origin: HND
    return_destination: SFO
    return: 2027-05-23
    pto: 6
    full_read: false   # outbound-only read; single SerpApi request
    role: baseline     # not open jaw -- comparison only, never a bookable candidate
    note: "Round-trip baseline -- prices the open-jaw premium. Take the RT
           only if the open jaw costs more than about $120 extra."

  # --- same round trip, nonstop forced both ways -------------------------
  - id: fri14_sun23_rt_hnd_ns
    origin: SFO
    destination: HND
    depart: 2027-05-14
    return_origin: HND
    return_destination: SFO
    return: 2027-05-23
    pto: 6
    full_read: true    # confirms the return leg is genuinely nonstop too
    nonstop: true
    role: baseline     # not open jaw -- comparison only, never a bookable candidate
    note: "Double-nonstop baseline -- same round trip as fri14_sun23_rt_hnd
           but nonstop both ways. Prices the nonstop premium over the
           stops-allowed RT baseline."

  # --- nonstop-only variants of the 3 date pairs above ------------------
  # TESTING/EXPLORATORY -- added to learn SerpApi's `stops` param behavior,
  # not yet a decided permanent tracking set. Each costs 2 requests via
  # full_read. With these 3 plus the double-nonstop RT baseline above,
  # total quota is ~15 requests/poll (~225/month on the every-other-day
  # cron), well over the ~100 free-tier cap -- revisit before leaving this
  # running unattended: trim back down, or slow the cron further.
  - id: fri14_sun23_hnd_kix_ns
    origin: SFO
    destination: HND
    depart: 2027-05-14
    return_origin: KIX
    return_destination: SFO
    return: 2027-05-23
    pto: 6
    full_read: true
    nonstop: true
    note: "NONSTOP TEST -- nonstop-only variant of the target pairing."

  - id: thu13_sun23_hnd_kix_ns
    origin: SFO
    destination: HND
    depart: 2027-05-13
    return_origin: KIX
    return_destination: SFO
    return: 2027-05-23
    pto: 7
    full_read: true
    nonstop: true
    note: "NONSTOP TEST -- nonstop-only variant of the front-extra-day pairing."

  - id: fri14_mon24_hnd_kix_ns
    origin: SFO
    destination: HND
    depart: 2027-05-14
    return_origin: KIX
    return_destination: SFO
    return: 2027-05-24
    pto: 7
    full_read: true
    nonstop: true
    note: "NONSTOP TEST -- nonstop-only variant of the back-extra-day pairing."

# ---------------------------------------------------------------------------
# Alert rules. Evaluated in order; first match wins for a given route/run.
# ---------------------------------------------------------------------------
alerts:
  book_now_usd: 900          # hard floor, ignores history, book on sight
  ignore_above_usd: 1500     # ceiling -- suppress all non-FLOOR alerts above

  min_observations: 12       # total history for the route before rules arm
  new_low_window_days: 30
  min_obs_in_window: 8       # a window must ALSO be this deep before its rule
                             # can fire. Without it, one lonely observation
                             # inside the 30d window yields a "lowest in 30
                             # days" on any number below it.
  percentile_window_days: 60
  percentile_threshold: 20
  drop_pct_vs_median: 12

  prefer_under_min: 1020     # 17h soft preference on TRUE combined duration.
                             # Longer offers still get recorded and can still
                             # alert -- this only flags the duration in the
                             # alert message. Only meaningful on full_read
                             # routes; non-full_read routes have no combined
                             # duration to compare against.

  # Debounce, keyed to the ROUTE rather than route+rule -- otherwise NEW_LOW
  # and PERCENTILE take turns on the same slow decline and you get an alert
  # most days. Measured on a 45-day, 6-route simulation: 29 notification days
  # under the old per-rule key, 15 under this one.
  cooldown_hours: 48
  cooldown_override_pct: 5

  # Absolute stop. Never more than this many alert days per route per 30 days,
  # whatever fires. FLOOR is exempt -- a sub-$900 fare always gets through.
  max_alerts_per_route_per_month: 6

notify:
  telegram: true
  email: false
  email_to: ""

site:
  json_out: docs/data.json   # written by analyze.py --json, read by the site
